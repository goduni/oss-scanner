name: "Check unissh"
# Builds projects/unissh/ with tools/check, as build.yaml does for an enrolment pull request.

on:
  push:
    branches: ["ci/check-unissh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Make room and install PyYAML
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Build projects/unissh with tools/check
        run: python3 tools/check --no-shell unissh < /dev/null

      - name: Disk after the build
        if: always()
        run: df -h /
